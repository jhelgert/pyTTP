name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly, full matrix
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: ruff
        run: |
          uv run --no-project --with ruff ruff check .
          uv run --no-project --with ruff ruff format --check --exclude README.md .
      - name: clang-format
        run: |
          uv tool install clang-format
          clang-format --dry-run --Werror src/cpp/*.cpp src/cpp/*.hpp
      - name: pyrefly
        run: uv run pyrefly check

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Configure (exports compile_commands.json)
        run: |
          uv sync
          uv run cmake -S . -B build/tidy -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$PWD/.venv/bin/python" -Dnanobind_DIR="$(uv run python -m nanobind --cmake_dir)" -DPYTTP_NATIVE=OFF
      - name: clang-tidy
        run: |
          sudo apt-get update && sudo apt-get install -y clang-tidy
          clang-tidy -p build/tidy --warnings-as-errors='*' src/cpp/*.cpp

  # Pull requests get a small matrix; master, the weekly schedule and manual runs get the full one.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          def combos(oses, pythons):
              return [{"os": o, "python": p} for o in oses for p in pythons]

          if os.environ["EVENT"] == "pull_request":
              include = combos(["ubuntu-24.04", "macos-15", "windows-2025"], ["3.11", "3.15"])
              include += combos(["ubuntu-24.04-arm"], ["3.11"])
          else:
              include = combos(
                  [
                      "ubuntu-24.04", "ubuntu-24.04-arm", "ubuntu-26.04", "ubuntu-26.04-arm",
                      "macos-15", "macos-15-intel", "macos-26", "macos-26-intel",
                      "windows-2025",
                  ],
                  ["3.11", "3.15"],
              )
          print("matrix=" + json.dumps({"include": include}))
          PY

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm needs the tags
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install (builds the extension)
        run: uv sync --python ${{ matrix.python }}
        env:
          CMAKE_ARGS: -DPYTTP_NATIVE=OFF
      - name: Test
        run: uv run pytest
