name: Release

# The only workflow with triggers. Nothing runs for pull requests or for pushes to a branch: the
# whole pipeline (checks, benchmark, wheels, upload) runs when a release is published or a v* tag
# is pushed, and only if the tagged commit is on master.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

# Publishing a release together with a new tag fires both events; keep a single run per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A tag has no branch, so check that the tagged commit is part of master.
  on-master:
    name: tagged commit is on master
    # The release event is not filtered by tag name like the push trigger is.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that ${{ github.sha }} is reachable from master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF points to $GITHUB_SHA, which is not on master. Releases are only built from master."
            exit 1
          fi

  checks:
    needs: on-master
    uses: ./.github/workflows/ci.yml

  benchmark:
    needs: on-master
    uses: ./.github/workflows/benchmark.yml

  sdist:
    needs: on-master
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    needs: on-master
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `publish` marks the runners whose wheels are uploaded to the index. The others only
        # check that the wheel builds and imports on a newer image.
        include:
          - { os: ubuntu-24.04, publish: true } # manylinux x86_64
          - { os: ubuntu-24.04-arm, publish: true } # manylinux aarch64
          - { os: macos-15-intel, publish: true } # macOS x86_64
          - { os: macos-15, publish: true } # macOS arm64
          - { os: windows-2025, publish: true } # Windows AMD64
          - { os: macos-26, publish: false, build: "cp314-macosx_arm64" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0 # the "build[uv]" frontend needs uv on the host (macOS, Windows)
      - name: Build wheels (config from pyproject.toml)
        if: matrix.publish
        uses: pypa/cibuildwheel@v4.3.0
      - name: Check build on a newer image (one wheel, import test only)
        if: ${{ !matrix.publish }}
        uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_TEST_COMMAND: python -c "import pyttp; assert pyttp.is_valid_schedule(pyttp.canonical_schedule(4))"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.publish && 'dist' || 'check' }}-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Only after every check and every build succeeded.
  publish-testpypi:
    needs: [checks, sdist, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyttp
    permissions:
      id-token: write # Trusted Publishing (OIDC), no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
